<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyBoard</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    #photo-link { position: relative; display: block; width: 100%; height: 100%; pointer-events: none; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
    #photo-action { display: none; position: absolute; top: 8px; right: 8px; padding: 4px 6px; border: 1px solid #000; background: #fff; color: #000; font: bold 10px sans-serif; }
  </style>
</head>
<body>
  <a id="photo-link" href="#">
    <img id="skyboard" src="/output/kobo_sky.png" alt="SkyBoard">
    <span id="photo-action">PHOTO + CRÉDIT</span>
  </a>
  <script>
    var image = document.getElementById("skyboard");
    var photoLink = document.getElementById("photo-link");
    var photoAction = document.getElementById("photo-action");
    function refresh() {
      image.src = "/output/kobo_sky.png?t=" + Date.now();
      var request = new XMLHttpRequest();
      request.open("GET", "/photo-link?t=" + Date.now(), true);
      request.onreadystatechange = function () {
        if (request.readyState !== 4) return;
        var response = JSON.parse(request.responseText);
        var link = response.link || "";
        if (link.indexOf("https://www.planespotters.net/photo/") === 0) {
          photoLink.href = link;
          photoLink.style.pointerEvents = "auto";
          photoAction.style.display = "block";
        } else {
          photoLink.href = "#";
          photoLink.style.pointerEvents = "none";
          photoAction.style.display = "none";
        }
      };
      request.send();
    }
    image.onerror = function () { setTimeout(refresh, 2000); };
    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
